<text x="220" y="3270" text-anchor="start" dominant-baseline="middle" font-size="27" font-weight="700">NOTATION AND IMPLEMENTATION NOTES</text>
<text x="220" y="3320" text-anchor="start" dominant-baseline="middle" font-size="23">Rectangle = entity · Oval = attribute · Diamond = relationship · Underline = entity primary key.</text>
<text x="220" y="3357" text-anchor="start" dominant-baseline="middle" font-size="23">M:N relationships have optional participation (0..*) at both entity ends; trunks only route connectors.</text>
<text x="220" y="3394" text-anchor="start" dominant-baseline="middle" font-size="23">Each relationship occurrence identifies exactly one existing entity on each side; SQL junction keys enforce uniqueness.</text>
<text x="220" y="3431" text-anchor="start" dominant-baseline="middle" font-size="23">Username / email and Genre.name / Platform.name are UNIQUE, not the selected entity primary keys.</text>
<text x="220" y="3468" text-anchor="start" dominant-baseline="middle" font-size="23">No mongo_metadata_id exists in Game. MongoDB links use shared IDs, not cross-database SQL foreign keys.</text>
<text x="220" y="3505" text-anchor="start" dominant-baseline="middle" font-size="23">All base-schema timestamps are shown. See DATABASE_MODEL.md for SQL constraints and the separate MongoDB model.</text>
<text x="220" y="3542" text-anchor="start" dominant-baseline="middle" font-size="23">Game.avg_rating is a stored derived value maintained by the insert, update and delete triggers on Rates.</text></g></svg>
