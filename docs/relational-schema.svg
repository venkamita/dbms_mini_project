<rect x="140" y="2300" width="3320" height="170" fill="white" stroke="#172b4d" stroke-width="3"/>
<text x="180" y="2335" text-anchor="start" dominant-baseline="middle" font-size="23">Each junction-table PK is the combination of BOTH underlined ID columns; neither ID alone is unique.</text>
<text x="180" y="2370" text-anchor="start" dominant-baseline="middle" font-size="23">Every junction row has exactly one parent on each side; a parent may have zero or many junction rows.</text>
<text x="180" y="2405" text-anchor="start" dominant-baseline="middle" font-size="23">All 12 FK mappings are stated beneath their tables. Arrows point to parent PKs; shared outside rails bundle references.</text>
<text x="180" y="2440" text-anchor="start" dominant-baseline="middle" font-size="23">Constraints / defaults / indexes / MongoDB associations: DATABASE_MODEL.md. Optional last_login ALTER demo is excluded.</text></g></svg>
